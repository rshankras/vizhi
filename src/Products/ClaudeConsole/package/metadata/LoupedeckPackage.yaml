# ==================================================================================================
# GENERAL SETTINGS
# ==================================================================================================

# Package type. Must be plugin4 for plugins.
type: plugin4

# Name that identifies the plugin.
name: ClaudeConsole

# Plugin name that is shown to the user.
displayName: Vizhi for Claude Code

# Short description of the plugin.
description: Control Claude Code in Apple Terminal, iTerm2 or Windows Terminal from the MX Creative Keypad.

# Name of the plugin library file.
pluginFileName: ClaudeConsolePlugin.dll

# Plugin version.
version: 2.4.0

# Author of the plugin. The author can be a company or an individual developer.
author: S.Ravi Shankar

# Copyright information.
copyright: Copyright © 2026 S.Ravi Shankar. All rights reserved.


# ==================================================================================================
# PLUGIN PROPERTIES
# ==================================================================================================

# Location of plugin files on Windows (relative to the plugin base directory).
# This parameter is required to support Windows.
# Deliberately the SAME folder as pluginFolderMac: one bin/ holds the plugin assembly plus both
# platforms' payloads, and each OS ignores the other's (the .exe helpers are inert on macOS, the
# voice/ bundle inert on Windows). 1.8.6 briefly split these into separate folders on a theory
# that sharing broke macOS application registration — that theory was wrong (the identical 1.7.1
# package failed the same way on the same machine, so the package was never the variable), and
# splitting tripled the package to 35 MB. Windows was verified working on hardware with this
# shared layout.
pluginFolderWin: bin

# Location of plugin files on macOS (relative to the plugin base directory).
# This parameter is required to support Mac.
pluginFolderMac: bin

# List of devices the plugin is optimized for.
supportedDevices:
    # LogitechCreativeFamily covers the MX Creative Console devices:
    # MX Creative Keypad (the 9 LCD keys) and MX Creative Dialpad (the dial/ring).
    - LogitechCreativeFamily

    # LoupedeckCtFamily covers Loupedeck CT, Live and Live S, and the Razer Stream Controllers.
    # Uncomment to also support those devices.
    #- LoupedeckCtFamily

# List of plugin capabilities.
pluginCapabilities:
    # Universal plugin (the same shape as Spotify): no application binding, no packaged profile.
    # Users add Terminal as an application in Options+ and drag these actions onto its profile, or
    # import the ready-made layout from profiles/ in the repo. Decided with Logitech on 2026-08-28
    # (#23). With no application entry of our own there is nothing to register, orphan, or lose on
    # a reinstall — the whole class of defects behind #20, #34 and #45 is gone rather than fixed —
    # and two of our plugins can coexist, since neither claims the terminal. (The 1.5-era crash came
    # from HasApplication with an EMPTY bundle name; the binding that needed is simply gone now.)
    - HasNoApplication

    # Uncomment the following line if the plugin sends keyboard shortcuts to the target application.
    #- ActivatesApplication

# Minimum Loupedeck version supported by the plugin.
# 6.4 = first Logi Plugin Service on the .NET 10 runtime; this net10.0-built DLL
# will not load on the older .NET 8-based services.
minimumLoupedeckVersion: 6.4


# ==================================================================================================
# LOUPEDECK MARKETPLACE SETTINGS
# ==================================================================================================

# Name of the license that the plugin is licensed under. Select the one that you prefer.
# NOTE: GPL license is not compatible with Loupedeck Marketplace.
license: Proprietary

# URL of the plugin license.
licenseUrl: https://vizhi.dev/eula/

# URL of the support page where the users can send improvement suggestions and report bugs.
# The URL is shown in Loupedeck Marketplace. The page can be for example a GitHub issues page.
# NOTE: This setting is recommended when publishing the plugin in Loupedeck Marketplace.
supportPageUrl: https://vizhi.dev/faq/

# URL of the plugin homepage. The URL is shown in Loupedeck Marketplace.
homePageUrl: https://vizhi.dev/claude-console/
